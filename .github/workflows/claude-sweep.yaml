name: Claude Sweep
on:
  schedule:
    # 毎週月曜 09:00 JST
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: claude-sweep
  cancel-in-progress: false

jobs:
  claude-sweep:
    name: claude-sweep
    permissions:
      contents: read # checkout と差分の取得のため
      actions: read # 前回成功した run を gh run list で引くため
      issues: write # 指摘を issue に起票するため
    uses: dope-corp/.github/.github/workflows/reusable-claude-sweep.yaml@5560af6f744d9cdd4b9ee522cff86519bf0cf86e # v1.0.9
    secrets:
      # environment に移さない。Free plan の private リポジトリでは environment を使えず、public リポジトリで
      # required reviewers を付けると週次の sweep のたびに承認が要るため
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]
