name: Claude Sweep
on:
  schedule:
    # 毎週月曜 09:00 JST
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: claude-sweep
  cancel-in-progress: false

# 前回レビューした地点 (default branch で最後に成功した run の head commit) から HEAD までの差分をレビューし、指摘を issue に起票する。
# 起点を tag で持つと、GITHUB_TOKEN は workflow ファイルの変更を含む commit へ ref を動かせず、push が拒否されることがある。
# review job には issues: write の token と Claude の OAuth credential が残るため、prompt injection による
# issue 操作・credential の露出は --allowedTools で Bash を絞って緩和するだけにとどまる。
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 差分計算に全履歴が要る
          fetch-depth: 0
          persist-credentials: false

      - name: Determine review range
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head="$(git rev-parse HEAD)"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          # review が失敗した run は起点にならず、次回に同じ範囲を再レビューする
          base="$(gh run list --workflow claude-sweep.yaml --branch "$DEFAULT_BRANCH" --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -z "$base" ]; then
            # 初回は全体のレビューが大きすぎるため、成功で終えて起点を作るだけにする
            echo "成功した run が無いため bootstrap する (レビューは次回から)"
          elif git diff --quiet "${base}..${head}"; then
            # 差分が無ければ Claude を起動しない (費用を抑えるため)
            echo "前回レビュー以降の差分が無いためスキップする"
          else
            echo "mode=review" >> "$GITHUB_OUTPUT"
            echo "base=${base}" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: plan
    if: needs.plan.outputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code sweep
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          # Claude が Bash から gh CLI を使うため
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 未指定だと action は OIDC で Claude GitHub App の token を取得し、job の permissions に
          # 縛られない。github.token を渡して job の権限に閉じる
          github_token: ${{ github.token }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh search issues:*),Bash(gh issue create:*),Bash(gh label list:*),Bash(gh label create:*)"
          prompt: |
            このリポジトリの定期レビュー sweep を実行してください。

            対象範囲: ${{ needs.plan.outputs.base }}..${{ needs.plan.outputs.head }}

            手順:
            1. `git log --oneline <base>..<head>` と `git diff <base>..<head>` で変更内容を把握する。
            2. 差分とその周辺コードを以下の観点でレビューする:
               - correctness: バグ、エッジケースの見落とし、エラーハンドリングの欠落、レグレッション
               - security: 入力検証、認証・認可、secret の扱い、危険なコマンド実行
               - simplification: コードの重複、既存ユーティリティの再利用漏れ、不要な複雑さ、非効率な実装
            3. 起票前に重複排除する: `gh issue list --label claude-sweep --state all --limit 1000` で
               過去の指摘を全件確認し、同一の問題 (同じ箇所・同じ趣旨) は起票しない。close 済みで
               wontfix 判断されたものも再起票しない。
            4. label が無ければ `gh label create claude-sweep --description "Claude weekly sweep findings" --color 5319E7` で作成する。
            5. 新規の指摘のみ、1 指摘 = 1 issue で起票する。各 issue には以下を含める:
               - 対象箇所 (file:line。コミット SHA 付きの permalink)
               - 問題の説明と、そう判断した根拠
               - 推奨する修正方針
               - severity (high/medium/low) と confidence (high/medium/low)
               - label: claude-sweep
            6. 修正 PR は作らない。コードも変更しない。issue 起票がこのタスクの終点。

            最後に、起票した issue の一覧と、重複としてスキップした指摘の要約を出力してください。
