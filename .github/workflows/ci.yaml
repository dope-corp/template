name: CI

on:
  # main への変更は PR 経由で入れ、その PR で検証するため push トリガーは置かない
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# job の name は required status check の名前になる (reusable workflow を呼ぶ job は "<この job の name> / <本体の job の name>")。
# 変えるときは ruleset と .github/jactionlint.yaml の required-checks も揃える
jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # org の Actions 許可設定で jdx/mise-action@* を許可している必要がある。
      # mise.lock があると --locked で install するので、mise.toml と食い違えばここで失敗する
      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Run prek
        run: mise run pre-commit

      # hook は commit を GitHub API に依存させないよう offline で動くので、online の検査 (impostor commit 等) はここで行う。
      # token はこの step にだけ渡す
      - name: Run zizmor with online audits
        run: mise exec -- zizmor --persona auditor --strict-collection .
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}

      # zizmor と同じく online の検査はここで行う。strict: 照会できなかった action を黙って飛ばさない
      - name: Run jactionlint with online checks
        run: mise exec -- jactionlint --strict-exit --online=strict
        env:
          GITHUB_TOKEN: ${{ github.token }}

  gitleaks:
    name: gitleaks
    permissions:
      contents: read
    uses: dope-corp/.github/.github/workflows/reusable-gitleaks.yaml@f090aa1db7ee315faab252e6f9c1aa4976604d72 # v1.0.2
