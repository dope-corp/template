name: CI

on:
  # main への変更は PR 経由で入れ、その PR で検証するため push トリガーは置かない
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# job 名がそのまま required status check の名前になるため、変えるときは ruleset の設定も合わせる
jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # org の Actions 許可設定で jdx/mise-action@* を許可している必要がある。
      # mise.lock があると `mise install --locked` になり、mise.toml と食い違えばここで失敗する
      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Run prek
        run: mise exec -- prek run --all-files

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks で全履歴をスキャンするため
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Run gitleaks
        run: mise exec -- gitleaks git --redact -v .
