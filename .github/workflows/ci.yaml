name: CI

on:
  # main への変更は PR 経由で入れ、その PR で検証するため push トリガーは置かない
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# job の name がそのまま required status check の名前になるため、変えるときは ruleset の設定も合わせる
jobs:
  prek:
    name: prek
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # org の Actions 許可設定で jdx/mise-action@* を許可している必要がある。
      # mise.lock があると `mise install --locked` になり、mise.toml と食い違えばここで失敗する
      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Run prek
        run: mise run pre-commit

      # prek の zizmor hook は --offline で動くので、online audit
      # (impostor-commit・known-vulnerable-actions 等) を含めてここで実行する。
      # token は他の hook に渡さないよう、この step だけに渡す
      - name: Run zizmor with online audits
        run: mise exec -- zizmor --persona auditor --strict-collection .
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}

      # jactionlint の online check (impostor commit・archived repository・advisory 等) も hook では走らないので、ここで実行する。
      # strict: 照会できなかった action があれば黙って飛ばさず失敗にする
      - name: Run jactionlint with online checks
        run: mise exec -- jactionlint --strict-exit --online=strict
        env:
          GITHUB_TOKEN: ${{ github.token }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks で全履歴をスキャンするため
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Run gitleaks
        run: mise exec -- gitleaks git --redact -v .
