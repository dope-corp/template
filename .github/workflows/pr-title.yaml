name: PR Title

on:
  # squash merge の commit title は PR タイトルになるので、タイトルの変更 (edited) でも検査し直す。
  # required check は head の commit ごとに付くので、push (synchronize) でも検査する
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    permissions:
      contents: read
    uses: dope-corp/.github/.github/workflows/reusable-pr-title.yaml@f090aa1db7ee315faab252e6f9c1aa4976604d72 # v1.0.2
