name: バグ報告
description: バグを報告する
type: Bug
body:
  - type: textarea
    id: summary
    attributes:
      label: バグの概要
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      value: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作と実際の動作
      description: スクリーンショットやログがあれば添付してください
  - type: textarea
    id: env
    attributes:
      label: 環境
      value: |
        - OS:
        - バージョン:
        - デバイス/ブラウザ:
