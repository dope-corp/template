# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json
profile: pedantic

rules:
  # ubuntu-latest は GitHub が新しい image に切り替えるが、job が使うのは mise で pin したツールと git・gh だけで
  # 影響が小さいので、版を固定して更新の PR を毎回レビューする手間をかけない
  mutable-runner-label: off
  # 使う action だけを並べ、新しい action は明示して足す。org の Actions 許可設定 (README「GitHub リポジトリ設定」) より広げない
  forbidden-uses:
    allow:
      - actions/checkout
      - jdx/mise-action
      - anthropics/claude-code-action
  timeout-too-long:
    max: 30

config-variables: []
config-secrets:
  - CLAUDE_CODE_OAUTH_TOKEN

# GitHub の ruleset の設定はコードから読めないので、README「public リポジトリで行う設定」の required checks と手で揃える
required-checks:
  - name: prek
    branches: [main]
  - name: gitleaks
    branches: [main]

# 外部の runner サービスは使わないので、そのラベルも受け付けない
self-hosted-runner:
  providers: []

shellcheck:
  enable: [all]
