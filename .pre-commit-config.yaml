# commitlint を commit-msg stage で動かすため、commit-msg hook も導入する
default_install_hook_types:
  - pre-commit
  - commit-msg
# stages 未指定の hook は導入した全 hook type で走るため、commit-msg stage で重ねて走らないよう限定する
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      # macOS / Windows の checkout で衝突・失敗するファイル名を止める
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-merge-conflict
      - id: mixed-line-ending
      # private リポジトリは ruleset で main への push を止められないので、手元で main に commit した時点で止める。
      # pre-commit stage だけなので、git merge が競合なく自動で作る merge commit は止めない
      - id: no-commit-to-branch
        args: [--branch, main]
  # ツールは mise.toml で pin した版を使う。git hook はシェルの PATH を引き継がないことがあるので、mise exec / mise run で起動する
  - repo: local
    hooks:
      - id: mise-task-docs
        name: Sync task docs into README.md
        language: system
        entry: mise run docs
        # README.md を手で直して task の一覧が崩れたときも同期し直す。README.md の <!-- mise-tasks --> マーカーが要る
        files: ^(mise\.toml|README\.md)$
        pass_filenames: false
      - id: dprint-fmt
        name: Format json/yaml/markdown/toml with dprint
        language: system
        # --allow-no-files: 渡されたファイルがすべて dprint.json の excludes に当たるとき
        # (mise.lock だけの commit 等) に exit 14 (No files found) で失敗しないようにする
        entry: mise exec -- dprint fmt --allow-no-files
        types_or: [json, yaml, markdown, toml]
      # profile と rule の設定は .github/jactionlint.yaml にある。--strict-exit で warn / info の finding も失敗にする。
      # --no-online: 環境変数 (JACTIONLINT_ONLINE) で online check が入り、commit が GitHub API に依存しないようにする。
      # required-checks の検査は全 workflow を見るので、ファイルを渡さずリポジトリ全体を検査し、
      # required check を報告する workflow の削除だけの commit でも実行する
      - id: jactionlint
        name: Lint GitHub Actions workflows with jactionlint
        language: system
        entry: mise exec -- jactionlint --strict-exit --no-online
        files: (^\.github/|(^|/)action\.ya?ml$)
        pass_filenames: false
        include_deleted: true
      - id: typos
        name: Check spelling with typos
        language: system
        # prek はファイル名を直接渡すので、typos.toml の除外を渡したファイルにも適用する
        entry: mise exec -- typos --force-exclude
      # auditor persona: false positive を含めて全 finding を出す最も厳しい設定。
      # --strict-collection: 解析できない入力を黙って飛ばさず失敗にする。
      # --offline: 環境の token を拾って commit が GitHub API に依存しないようにする。online audit は ci.yaml の専用 step が行う。
      # 未追跡の草稿で commit を止めないよう、作業ツリー全体ではなく prek が選んだファイルだけを監査する
      - id: zizmor
        name: Audit GitHub Actions workflows and hook config with zizmor
        language: system
        entry: mise exec -- zizmor --persona auditor --strict-collection --offline
        files: (^\.github/workflows/[^/]+\.ya?ml$|(^|/)action\.ya?ml$|^\.github/dependabot\.ya?ml$|^\.pre-commit-(config|hooks)\.yaml$)
      # CI の gitleaks job は commit 後の検知なので、commit 前に止めるのはこの hook が担う
      # (GitHub Free plan の private リポジトリには push protection が無い)
      - id: gitleaks
        name: Scan staged changes for secrets with gitleaks
        language: system
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --verbose
        pass_filenames: false
      - id: commitlint
        name: Lint commit message with commitlint
        # language: node なので prek が node と依存を隔離環境に入れる。リポジトリに node は要らない
        language: node
        additional_dependencies:
          ["@commitlint/cli@21.2.4", "@commitlint/config-conventional@21.2.4"]
        entry: commitlint --edit
        stages: [commit-msg]
