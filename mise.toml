# ツールのバージョンは Renovate (mise manager) が bump し、mise.lock も同じ PR で更新する。
# latest 指定にしない。手で変更したときは `mise lock` を実行して mise.lock を追従させる。
[tools]
prek = "0.5.3"
actionlint = "1.7.12"
dprint = "0.57.4"
fnox = "v1.35.2"
gitleaks = "8.30.1"

[tasks.docs]
description = "Sync the task list embedded in README.md with mise.toml"
run = "mise generate task-docs --inject --output README.md"

[hooks]
postinstall = "prek install"

[settings]
lockfile = true
